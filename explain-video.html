<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>硬切，不是硬糊 — comfyui-h3-hardcut 图解</title>
<style>
  :root{
    --bg:#151210; --panel:#1e1a16; --line:#332b23;
    --ink:#f3ece3; --dim:#a2968a;
    --hot:#ff8a3d; --gold:#ffd166; --ok:#7ddc8a; --bad:#ff5f56; --cool:#6fb3ff;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;
    display:flex; align-items:center; justify-content:center; padding:16px;
  }
  .player{width:min(1120px,100%); }
  .stage{
    position:relative; width:100%; aspect-ratio:16/9;
    background:linear-gradient(160deg,#1d1815,#141110 60%);
    border:1px solid var(--line); border-radius:14px; overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.55);
  }
  .bar{position:absolute;top:0;left:0;height:3px;background:var(--hot);width:0;z-index:5;transition:width .1s linear}
  .chip{
    position:absolute;top:14px;left:18px;z-index:4;font-size:13px;letter-spacing:.08em;
    color:var(--dim);background:rgba(0,0,0,.35);border:1px solid var(--line);
    padding:4px 10px;border-radius:999px;
  }
  .scene{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s ease}
  .scene.on{opacity:1}
  .scene svg{width:100%;height:100%;display:block}
  .cap{
    position:absolute;left:0;right:0;bottom:0;padding:22px 26px 26px;
    background:linear-gradient(0deg,rgba(10,8,7,.92),rgba(10,8,7,0));
  }
  .cap h2{margin:0 0 6px;font-size:22px;font-weight:650;letter-spacing:.01em}
  .cap p{margin:0;font-size:15px;line-height:1.7;color:#d8cec3;max-width:74ch}
  .cap .kbd{color:var(--gold);font-weight:600}
  .controls{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
  button{
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
    border-radius:9px;padding:8px 14px;font-size:14px;cursor:pointer;
  }
  button:hover{border-color:var(--hot);color:var(--gold)}
  .dots{display:flex;gap:6px;margin-left:auto}
  .dot{width:9px;height:9px;border-radius:50%;background:#3a322b;cursor:pointer}
  .dot.on{background:var(--hot)}
  .hint{color:var(--dim);font-size:13px}
  /* ---- shared svg bits ---- */
  .t{font-size:15px;fill:#d8cec3}
  .t-dim{font-size:13px;fill:var(--dim)}
  .t-big{font-size:30px;font-weight:700;fill:var(--ink)}
  .t-hot{font-size:15px;font-weight:600;fill:var(--hot)}
  .t-gold{font-size:15px;font-weight:600;fill:var(--gold)}
  .t-mono{font-family:ui-monospace,Consolas,monospace;font-size:13px;fill:#cfc6bb}
  .t-mono-b{font-family:ui-monospace,Consolas,monospace;font-size:15px;font-weight:600}
  .fade{opacity:0;animation:fadeIn .6s ease forwards}
  .d1{animation-delay:.35s}.d2{animation-delay:.8s}.d3{animation-delay:1.3s}
  .d4{animation-delay:1.9s}.d5{animation-delay:2.5s}
  @keyframes fadeIn{to{opacity:1}}
  .glitch{animation:gl .28s steps(2) infinite;filter:blur(1.4px)}
  @keyframes gl{0%{transform:translate(0,0)}50%{transform:translate(-3px,1px)}100%{transform:translate(2px,-1px)}}
  .slide{animation:slideIn .7s cubic-bezier(.2,.8,.2,1) forwards}
  @keyframes slideIn{from{transform:translateX(-120px);opacity:0}to{transform:translateX(0);opacity:1}}
  .pop{transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.2,1.4,.4,1) forwards}
  @keyframes pop{from{transform:scale(.4);opacity:0}to{transform:scale(1);opacity:1}}
  .grow{animation:grow 1s cubic-bezier(.2,.8,.2,1) forwards;transform-origin:left center}
  @keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
  .type{animation:type 1.1s steps(34) forwards;white-space:nowrap;overflow:hidden}
  @keyframes type{from{width:0}to{width:100%}}
  @media (max-width:760px){.cap h2{font-size:17px}.cap p{font-size:13px}}
</style>
</head>
<body>
<div class="player">
  <div class="stage">
    <div class="bar" id="bar"></div>
    <div class="chip" id="chip">comfyui-h3-hardcut</div>
    <div id="scenes"></div>
    <div class="cap"><h2 id="h2"></h2><p id="p"></p></div>
  </div>
  <div class="controls">
    <button id="play">⏸ 暂停</button>
    <button id="prev">← 上一幕</button>
    <button id="next">下一幕 →</button>
    <button id="restart">↻ 重播</button>
    <span class="hint">空格 播放/暂停 · ← → 切幕</span>
    <div class="dots" id="dots"></div>
  </div>
</div>

<script>
const HOT='#ff8a3d', GOLD='#ffd166', OK='#7ddc8a', BAD='#ff5f56', COOL='#6fb3ff', DIM='#a2968a';

/* 每个场景：SVG 画面 + 口播字幕 + 时长(ms) */
const SCENES = [
{ dur:7000, h:'分块生成，接缝会发糊', p:'视频一长就得切开分块生成。切开的地方，画面会糊一下，或者出现重影。',
  svg:`
  <rect x="90" y="150" width="880" height="90" rx="10" fill="#241d18" stroke="#3a3129"/>
  <rect x="90" y="150" width="300" height="90" rx="10" fill="#2b2320"/>
  <rect x="670" y="150" width="300" height="90" rx="10" fill="#2b2320"/>
  <g class="glitch"><rect x="390" y="150" width="280" height="90" fill="#4a2418" stroke="${BAD}" stroke-width="2"/></g>
  <text class="t-dim" x="90" y="132">第 1 段</text>
  <text class="t-dim" x="860" y="132" text-anchor="end">第 2 段</text>
  <text class="t" x="530" y="292" text-anchor="middle" fill="${BAD}">↑ 这里：发糊 / 重影</text>
  <text class="t-big" x="530" y="360" text-anchor="middle">接缝，是分块生成的老毛病</text>
  <text class="t-dim fade d2" x="530" y="410" text-anchor="middle">不是你参数没调好，是机制决定的</text>`},

{ dur:8000, h:'元凶：重叠区把分歧"抹"成糊', p:'前一段的尾巴和后一段的头在重叠区里被混在一起——可这两段是各自独立采样的，内容本来就不一样。混，只会把分歧抹成糊。',
  svg:`
  <rect x="90" y="120" width="520" height="70" rx="9" fill="#233043" stroke="${COOL}" stroke-opacity=".5"/>
  <text class="t-mono" x="106" y="163" fill="#cfe2ff">window A</text>
  <rect x="470" y="220" width="520" height="70" rx="9" fill="#3a2a1c" stroke="${HOT}" stroke-opacity=".5"/>
  <text class="t-mono" x="486" y="263" fill="#ffd8b8">window B</text>
  <g class="fade d2">
    <rect x="470" y="120" width="140" height="70" fill="#6a4a86" opacity=".85" filter="url(#b)"/>
    <rect x="470" y="220" width="140" height="70" fill="#6a4a86" opacity=".85" filter="url(#b)"/>
    <rect x="470" y="112" width="140" height="186" fill="none" stroke="#c39bff" stroke-width="2" stroke-dasharray="5 4"/>
    <text class="t" x="540" y="345" text-anchor="middle" fill="#c39bff">overlap：两段在这里被混合</text>
  </g>
  <defs><filter id="b"><feGaussianBlur stdDeviation="3"/></filter></defs>
  <text class="t-big fade d3" x="530" y="415" text-anchor="middle">两段各自采样 → 内容必然分歧</text>
  <text class="t-dim fade d4" x="530" y="455" text-anchor="middle">混合只是把分歧摊平，不会让它消失</text>`},

{ dur:7000, h:'做法：不混了，overlap = 0', p:'重叠区设为 0，两段首尾相接——这就是一次硬切。',
  svg:`
  <rect x="90" y="180" width="440" height="90" rx="9" fill="#233043" stroke="${COOL}" stroke-opacity=".55"/>
  <text class="t-mono" x="112" y="235" fill="#cfe2ff">window A</text>
  <rect x="530" y="180" width="440" height="90" rx="9" fill="#3a2a1c" stroke="${HOT}" stroke-opacity=".55"/>
  <text class="t-mono" x="552" y="235" fill="#ffd8b8">window B</text>
  <line x1="530" y1="168" x2="530" y2="282" stroke="#fff" stroke-width="3"/>
  <g class="pop d2"><circle cx="530" cy="150" r="16" fill="${HOT}"/></g>
  <text class="t-hot fade d3" x="530" y="330" text-anchor="middle">overlap = 0 → 纯追加，不混合</text>
  <text class="t-big fade d3" x="530" y="385" text-anchor="middle">这就是一次硬切</text>
  <text class="t-dim fade d4" x="530" y="432" text-anchor="middle">硬切本身是合法的剪辑语法</text>`},

{ dur:8500, h:'让提示词在同一帧切镜', p:'只要让提示词在同一帧要求模型换镜头，这条缝就从"缺陷"变成"剪辑点"。两边对齐到同一帧，事情就成了。',
  svg:`
  <rect x="90" y="150" width="440" height="80" rx="8" fill="#233043" stroke-opacity=".5" stroke="${COOL}"/>
  <rect x="530" y="150" width="440" height="80" rx="8" fill="#3a2a1c" stroke-opacity=".5" stroke="${HOT}"/>
  <line x1="530" y1="140" x2="530" y2="240" stroke="#fff" stroke-width="3"/>
  <rect x="120" y="290" width="820" height="66" rx="8" fill="#12100e" stroke="#3a3129"/>
  <text class="t-mono" x="140" y="330" fill="${GOLD}">[Shot 2] At 00:04.250, the shot cuts to a low angle …</text>
  <line class="fade d2" x1="530" y1="240" x2="530" y2="290" stroke="${GOLD}" stroke-width="2" stroke-dasharray="4 4"/>
  <g class="pop d3">
    <circle cx="530" cy="356" r="20" fill="none" stroke="${GOLD}" stroke-width="2"/>
    <text class="t-mono-b" x="530" y="363" text-anchor="middle" fill="${GOLD}">=</text>
  </g>
  <text class="t-big fade d3" x="530" y="440" text-anchor="middle">缝 = 剪辑点</text>
  <text class="t-dim fade d4" x="530" y="478" text-anchor="middle">执行器切的那一帧 = 提示词要求换镜的那一帧</text>`},

{ dur:8500, h:'硬约束：窗口起点落在 17 帧网格', p:'17 帧块 = 1 + 4 个 token，块首帧独占一个 token。所以起点必须是独占帧；你填 70，它帮你落到 68。',
  svg:`
  <text class="t-dim" x="90" y="140">17 帧 = 一块：块首帧独占 1 个 token，其后 4 帧共享一个</text>
  <g id="grid"></g>
  <g class="slide d3">
    <path d="M576 258 l0 56" stroke="${HOT}" stroke-width="3"/>
    <circle cx="576" cy="256" r="9" fill="${HOT}"/>
    <text class="t-hot" x="588" y="300">填 70</text>
  </g>
  <g class="fade d4">
    <path d="M562 258 l0 56" stroke="${GOLD}" stroke-width="3"/>
    <circle cx="562" cy="256" r="9" fill="${GOLD}"/>
    <text class="t-gold" x="550" y="300" text-anchor="end">落到 68 ✓</text>
    <text class="t-dim" x="530" y="400" text-anchor="middle">起点若落在共享组首（如 69）会让整段生成崩坏 —— 同 seed 实测：68 干净 / 69 崩</text>
    <text class="t-dim fade d5" x="530" y="440" text-anchor="middle">代价：边界精度下限 ≈ 2 帧（latent 时间粒度 4 帧/token），这是架构精度，不是 bug</text>
  </g>`},

{ dur:7000, h:'顺带：分段可以不等长', p:'第一段 68 帧、第二段 124 帧，随你排镜头，不用被等长切分绑死。',
  svg:`
  <rect x="90" y="200" width="180" height="96" rx="9" fill="#233043" stroke="${COOL}" stroke-opacity=".55"/>
  <text class="t-mono-b" x="180" y="258" text-anchor="middle" fill="#cfe2ff">68 帧</text>
  <rect x="278" y="200" width="330" height="96" rx="9" fill="#3a2a1c" stroke="${HOT}" stroke-opacity=".55"/>
  <text class="t-mono-b" x="443" y="258" text-anchor="middle" fill="#ffd8b8">124 帧</text>
  <line x1="278" y1="188" x2="278" y2="308" stroke="#fff" stroke-width="3"/>
  <text class="t-dim" x="180" y="330" text-anchor="middle">≈ 2.8s</text>
  <text class="t-dim" x="443" y="330" text-anchor="middle">≈ 5.2s</text>
  <text class="t-big fade d2" x="530" y="410" text-anchor="middle">cut_frames = "68"</text>
  <text class="t-dim fade d3" x="530" y="450" text-anchor="middle">想切几刀写几个数字：68,136 → 三段</text>`},

{ dur:8000, h:'副作用是好的：峰值显存更低', p:'8GB 显存的笔记本，1.5MP 画布能跑 15 秒——而 8 秒单窗在 1.0MP 就已经到顶了。',
  svg:`
  <text class="t-dim" x="90" y="140">负载 = 最长段帧数 × 二采画布 MP　（通过线 210 / 爆线 236，本机实测）</text>
  <text class="t-mono" x="90" y="205" fill="#cfc6bb">8s 单窗 @1.0MP</text>
  <rect x="300" y="185" width="270" height="28" rx="6" fill="#3a2320"/>
  <rect class="grow" x="300" y="185" width="243" height="28" rx="6" fill="${BAD}"/>
  <text class="t-mono-b" x="590" y="205" fill="${BAD}">202.9 到顶</text>
  <text class="t-mono" x="90" y="265" fill="#cfc6bb">15s 硬切 3 段 @1.5MP</text>
  <rect x="300" y="245" width="270" height="28" rx="6" fill="#20301f"/>
  <rect class="grow d2" x="300" y="245" width="245" height="28" rx="6" fill="${OK}"/>
  <text class="t-mono-b" x="590" y="265" fill="${OK}">204.0 ✅</text>
  <line x1="546" y1="160" x2="546" y2="300" stroke="${GOLD}" stroke-width="2" stroke-dasharray="5 4"/>
  <text class="t-gold fade d3" x="546" y="330" text-anchor="middle" transform="rotate(-90 546 330)"></text>
  <text class="t-dim fade d3" x="530" y="345" text-anchor="middle">↑ 通过线</text>
  <text class="t-big fade d3" x="530" y="420" text-anchor="middle">比单窗 8 秒还省</text>
  <text class="t-dim fade d4" x="530" y="462" text-anchor="middle">RTX 4060 Laptop 8GB · torch 2.14 + cu130</text>`},

{ dur:8000, h:'跑之前先体检：对不上就拦停', p:'提示词里的切镜时间跟执行器真正会切的那一帧对不上，它直接抛错——不让你白跑半小时。',
  svg:`
  <rect x="90" y="140" width="880" height="250" rx="10" fill="#0f0d0c" stroke="#3a3129"/>
  <text class="t-mono" x="112" y="172" fill="${DIM}">Hard-cut prompt check</text>
  <g class="fade d1"><text class="t-mono" x="112" y="204" fill="${OK}">✓ 6 sections present · shots 1..3 continuous</text></g>
  <g class="fade d2"><text class="t-mono" x="112" y="232" fill="${OK}">✓ [Shot 2] timestamp 4.250s = frame 102 = plan cut</text></g>
  <g class="fade d3"><text class="t-mono" x="112" y="260" fill="${OK}">✓ no "no cuts / continuous take" wording</text></g>
  <g class="fade d4"><text class="t-mono" x="112" y="288" fill="${OK}">✓ load 153.0 ≤ 210</text></g>
  <g class="fade d5">
    <text class="t-mono-b" x="112" y="336" fill="${OK}">status: OK</text>
    <text class="t-mono" x="112" y="368" fill="${BAD}">（对不上时：抛错并给出可达切点菜单）</text>
  </g>
  <text class="t-dim fade d5" x="530" y="452" text-anchor="middle">节点把报告直接印在自己身上，不需要额外 PreviewAny</text>`},

{ dur:7000, h:'缝还能看见？三档可选的修复', p:'磨平两帧、用重绘的桥段渐变贴回去、或者把崩掉的几帧叠化掉。都是可选的，不用就直通。',
  svg:`
  <g class="fade d1">
    <rect x="90" y="180" width="250" height="120" rx="10" fill="#1b1714" stroke="#4a3f36"/>
    <text class="t-gold" x="215" y="228" text-anchor="middle">磨平 blend</text>
    <text class="t-dim" x="215" y="256" text-anchor="middle">缝两侧两帧互相靠拢</text>
    <text class="t-mono" x="215" y="284" text-anchor="middle" fill="${GOLD}">0.3 ≈ 跳变 −40%</text>
  </g>
  <g class="fade d2">
    <rect x="375" y="180" width="250" height="120" rx="10" fill="#1b1714" stroke="#4a3f36"/>
    <text class="t-gold" x="500" y="228" text-anchor="middle">桥接 fuse</text>
    <text class="t-dim" x="500" y="256" text-anchor="middle">重绘 5 帧，渐变贴回</text>
    <text class="t-mono" x="500" y="284" text-anchor="middle" fill="${GOLD}">贴缝强 → 弱</text>
  </g>
  <g class="fade d3">
    <rect x="660" y="180" width="250" height="120" rx="10" fill="#1b1714" stroke="#4a3f36"/>
    <text class="t-gold" x="785" y="228" text-anchor="middle">叠化 dissolve</text>
    <text class="t-dim" x="785" y="256" text-anchor="middle">崩坏区间两端做锚</text>
    <text class="t-mono" x="785" y="284" text-anchor="middle" fill="${GOLD}">帧数不变</text>
  </g>
  <text class="t-dim fade d4" x="530" y="360" text-anchor="middle">全部 default 关闭 / bypass 直通 —— 主链路跑得好时不用管它们</text>
  <text class="t-dim fade d5" x="530" y="405" text-anchor="middle">先分清：位置错位（改边界）· 强度跳变（磨平或降 σ₀ 0.30→0.22）</text>
  <text class="t-dim fade d5" x="530" y="440" text-anchor="middle">⚠ 量清晰度时要排除 17 的倍数帧 —— 那是 H3 时间压缩的固有周期，不是接缝</text>`},

{ dur:8000, h:'开源：GPL-3.0，clone 即用', p:'它建在 T8 的 MiniMax H3 节点包之上，克隆到 custom_nodes，重启就能跑。',
  svg:`
  <text class="t-big" x="530" y="150" text-anchor="middle">comfyui-h3-hardcut</text>
  <rect x="140" y="200" width="780" height="54" rx="8" fill="#0f0d0c" stroke="#3a3129"/>
  <text class="t-mono" x="162" y="234" fill="${GOLD}">git clone …/comfyui-h3-hardcut.git   ComfyUI/custom_nodes/</text>
  <g class="fade d2">
    <rect x="140" y="282" width="380" height="96" rx="10" fill="#1b1714" stroke="#4a3f36"/>
    <text class="t-dim" x="162" y="318">前置</text>
    <text class="t-mono" x="162" y="348" fill="#cfc6bb">comfyui-minimax-h3-audio-T8</text>
    <text class="t-dim" x="162" y="368">(GPL-3.0-or-later，T8mars)</text>
  </g>
  <g class="fade d3">
    <rect x="540" y="282" width="380" height="96" rx="10" fill="#1b1714" stroke="#4a3f36"/>
    <text class="t-dim" x="562" y="318">许可</text>
    <text class="t-gold" x="562" y="352">GPL-3.0-or-later</text>
    <text class="t-dim" x="562" y="372">同进程调用上游模块，故沿用</text>
  </g>
  <text class="t-dim fade d4" x="530" y="428" text-anchor="middle">无额外 pip 依赖 · 重启 ComfyUI · 先看 status: OK 再跑</text>`}
];

/* ---------- 渲染 ---------- */
const wrap=document.getElementById('scenes'), dots=document.getElementById('dots');
SCENES.forEach((s,i)=>{
  const d=document.createElement('div'); d.className='scene'; d.innerHTML=s.svg; wrap.appendChild(d);
  const dot=document.createElement('div'); dot.className='dot'; dot.onclick=()=>go(i); dots.appendChild(dot);
});
const sceneEls=[...document.querySelectorAll('.scene')];
const dotEls=[...document.querySelectorAll('.dot')];

/* 17 帧网格（场景 5） */
(function(){
  const g=sceneEls[4].querySelector('#grid'); if(!g) return;
  const STEP=118; let x=90, s='';
  for(let k=0;k<8;k++){
    const ex=k*17, hi=(ex===68);
    s+=`<rect x="${x}" y="196" width="22" height="44" rx="4" fill="${hi?'#5a452a':'#33291f'}" stroke="${hi?GOLD:'#3a3129'}"/>`;
    s+=`<rect x="${x+26}" y="196" width="82" height="44" rx="4" fill="#1d1815" opacity=".6"/>`;
    s+=`<text class="t-mono" x="${x+11}" y="188" text-anchor="middle" fill="${hi?GOLD:DIM}">${ex}</text>`;
    x+=STEP;
  }
  s+=`<text class="t-dim" x="90" y="272">块首（独占 token）■　　其后 4 帧（共享 token）▬</text>`;
  g.innerHTML=s;
})();

let i=0, t0=0, playing=true, raf;
const bar=document.getElementById('bar'), h2=document.getElementById('h2'),
      p=document.getElementById('p'), chip=document.getElementById('chip');

function paint(){
  sceneEls.forEach((el,k)=>el.classList.toggle('on',k===i));
  dotEls.forEach((el,k)=>el.classList.toggle('on',k===i));
  const s=SCENES[i]; h2.textContent=s.h; p.textContent=s.p;
  chip.textContent=`${i+1} / ${SCENES.length}　·　comfyui-h3-hardcut`;
  bar.style.width='0%';
}
function tick(ts){
  if(!t0) t0=ts;
  const el=ts-t0, dur=SCENES[i].dur;
  bar.style.width=Math.min(100,el/dur*100)+'%';
  if(el>=dur){ next(); }
  else raf=requestAnimationFrame(tick);
}
function go(n){ i=(n+SCENES.length)%SCENES.length; t0=0; cancelAnimationFrame(raf); paint();
  if(playing) raf=requestAnimationFrame(tick); }
function next(){ go(i+1); }
function toggle(){ playing=!playing; document.getElementById('play').textContent=playing?'⏸ 暂停':'▶ 播放';
  cancelAnimationFrame(raf); t0=0; if(playing) raf=requestAnimationFrame(tick); }

document.getElementById('play').onclick=toggle;
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.getElementById('restart').onclick=()=>go(0);
addEventListener('keydown',e=>{
  if(e.code==='Space'){e.preventDefault();toggle();}
  if(e.code==='ArrowRight')go(i+1);
  if(e.code==='ArrowLeft')go(i-1);
});
paint(); raf=requestAnimationFrame(tick);
</script>
</body>
</html>
